<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFA GUNKA</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
#playerWrapper{position:relative}
#playerWrapper [data-banner-id="2029920"]{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body class="bg-[#0a0a0b] text-white min-h-screen">
<header class="p-5 border-b border-zinc-800 flex justify-between">
<h1 class="text-xl font-black">SFA <span class="text-yellow-400">GUNKA</span></h1>
<span class="text-xs bg-zinc-800 px-3 py-1 rounded-full">LIVE + ADS</span>
</header>

<div class="p-4 max-w-6xl mx-auto">
  <!-- BANNER TOP - ID 2029919 -->
  <div class="flex justify-center my-4 bg-zinc-900 p-2 rounded-xl border border-zinc-800 min-h-[90px]">
    <script async src="https://js.mbidadm.com/static/scripts.js" data-admpid="468708"></script>
    <div data-banner-id="2029919"></div>
  </div>

  <div id="videoGrid" class="grid grid-cols-1 md:grid-cols-3 gap-4">Loading videos...</div>

  <!-- BANNER BOTTOM - ID 2029919 -->
  <div class="flex justify-center my-6 bg-zinc-900 p-2 rounded-xl border border-zinc-800 min-h-[90px]">
    <div data-banner-id="2029919"></div>
  </div>
</div>

<!-- PLAYER MODAL -->
<div id="playerModal" class="fixed inset-0 bg-black/95 hidden z-[999] flex items-center justify-center p-4">
  <div class="bg-zinc-900 w-full max-w-3xl rounded-2xl overflow-hidden border border-zinc-800">
    <div class="p-3 flex justify-between items-center bg-black">
      <span id="playerTitle" class="font-bold truncate text-sm">Video</span>
      <button onclick="closePlayer()" class="bg-white text-black w-7 h-7 rounded-full font-bold">X</button>
    </div>

    <!-- VIDEO + INSTREAM WRAPPER -->
    <div id="playerWrapper" class="w-full aspect-video bg-black">
      <!-- INSTREAM AD - ID 2029920 - VIDEO KE UPAR AYEGA -->
      <div data-banner-id="2029920"></div>
      <video id="mainVideo" class="w-full h-full relative z-0" controls playsinline></video>
    </div>

    <div class="p-2 text-center text-[10px] text-zinc-500">Ad will auto skip in 5 sec • Support SFA GUNKA</div>
  </div>
</div>

<script>
const TOKEN="8895544903:AAHbD3V0yU-4vdXl8Ih_EadrmnZAgJWlHtQ";
async function play(file_id,title){
  document.getElementById('playerModal').classList.remove('hidden');
  document.getElementById('playerTitle').innerText=title;
  try{
    let res=await fetch(`https://api.telegram.org/bot${TOKEN}/getFile?file_id=${file_id}`);
    let data=await res.json();
    let v=document.getElementById('mainVideo');
    v.src=`https://api.telegram.org/file/bot${TOKEN}/${data.result.file_path}`;
    v.play();
  }catch(e){alert("Video load error");}
}
function closePlayer(){
  document.getElementById('playerModal').classList.add('hidden');
  let v=document.getElementById('mainVideo'); v.pause(); v.src="";
}
async function loadVideos(){
  try{
    let res=await fetch(`https://api.telegram.org/bot${TOKEN}/getUpdates?limit=100`);
    let data=await res.json();
    let posts=data.result.map(r=>r.channel_post||r.message).filter(Boolean).filter(p=>p.video);
    if(posts.length==0){document.getElementById('videoGrid').innerHTML="No videos - Upload from UPLOAD.HTML"; return;}
    document.getElementById('videoGrid').innerHTML=posts.reverse().map(p=>{
      if(!p.video?.file_id) return '';
      let t=(p.caption||"Video").replace(/'/g,"").substring(0,40);
      return `<div class="bg-zinc-900 rounded-xl overflow-hidden border border-zinc-800"><div class="aspect-video bg-zinc-800 flex items-center justify-center text-3xl">▶️</div><div class="p-3"><div class="font-bold truncate text-sm">${t}</div><button onclick="play('${p.video.file_id}','${t}')" class="mt-2 w-full bg-yellow-400 text-black py-2 rounded-lg font-bold text-sm">WATCH</button></div></div>`;
    }).join('');
  }catch(e){document.getElementById('videoGrid').innerHTML="Error loading videos";}
}
loadVideos();
</script>
</body>
</html>
