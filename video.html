<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFA GUNKA</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0b] text-white min-h-screen">
<header class="p-5 border-b border-zinc-800"><h1 class="text-xl font-black">SFA <span class="text-yellow-400">GUNKA</span></h1></header>

<div class="p-4 max-w-6xl mx-auto">
  <!-- MYBID AD TOP -->
  <div class="flex justify-center my-4 bg-zinc-900 p-2 rounded-xl border border-zinc-800">
    <script async src="https://js.mbidadm.com/static/scripts.js" data-admpid="468708"></script>
    <div data-banner-id="2029919"></div>
  </div>

  <div id="videoGrid" class="grid grid-cols-1 md:grid-cols-3 gap-4">Loading...</div>

  <!-- MYBID AD BOTTOM - 2nd time same ID se 2x earning -->
  <div class="flex justify-center my-6 bg-zinc-900 p-2 rounded-xl border border-zinc-800">
    <div data-banner-id="2029919"></div>
  </div>
</div>

<!-- PLAYER -->
<div id="playerModal" class="fixed inset-0 bg-black/95 hidden z-[999] flex items-center justify-center p-4">
<div class="bg-zinc-900 w-full max-w-3xl rounded-2xl overflow-hidden border border-zinc-800">
<div class="p-3 flex justify-between bg-black"><span id="playerTitle">Video</span><button onclick="closePlayer()" class="bg-white text-black w-7 h-7 rounded-full">X</button></div>
<video id="mainVideo" class="w-full aspect-video bg-black" controls playsinline></video>
</div>
</div>

<script>
const TOKEN="8895544903:AAHbD3V0yU-4vdXl8Ih_EadrmnZAgJWlHtQ";
const CHANNEL_ID="-1002897263402";
async function play(file_id,title){
  document.getElementById('playerModal').classList.remove('hidden');
  document.getElementById('playerTitle').innerText=title;
  let res=await fetch(`https://api.telegram.org/bot${TOKEN}/getFile?file_id=${file_id}`);
  let data=await res.json();
  let v=document.getElementById('mainVideo');
  v.src=`https://api.telegram.org/file/bot${TOKEN}/${data.result.file_path}`;
  v.play();
}
function closePlayer(){ document.getElementById('playerModal').classList.add('hidden'); let v=document.getElementById('mainVideo'); v.pause(); v.src=""; }
async function loadVideos(){
  let res=await fetch(`https://api.telegram.org/bot${TOKEN}/getUpdates?limit=100`);
  let data=await res.json();
  let posts=data.result.map(r=>r.channel_post||r.message).filter(Boolean).filter(p=>p.video);
  document.getElementById('videoGrid').innerHTML=posts.reverse().map(p=>{
    let t=(p.caption||"Video").replace(/'/g,"").substring(0,40);
    return `<div class="bg-zinc-900 rounded-xl overflow-hidden border border-zinc-800"><div class="aspect-video bg-zinc-800 flex items-center justify-center">▶️</div><div class="p-3"><div class="font-bold truncate text-sm">${t}</div><button onclick="play('${p.video.file_id}','${t}')" class="mt-2 w-full bg-yellow-400 text-black py-2 rounded-lg font-bold">WATCH</button></div></div>`;
  }).join('');
}
loadVideos();
</script>
</body>
</html>
